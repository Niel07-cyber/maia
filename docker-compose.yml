services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: maia
      POSTGRES_PASSWORD: maia
      POSTGRES_DB: maia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maia -d maia"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    image: maia-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://maia:maia@db:5432/maia
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    image: maia-backend:dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://maia:maia@db:5432/maia
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
