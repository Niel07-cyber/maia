[project]
name = "maia"
version = "0.1.0"
description = "MAIA backend: voice-driven LLM agent for rail maintenance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "pgvector>=0.5.1",
    "alembic>=1.20.1",
    "pydantic>=2.14.2",
    "litellm>=1.108.0",
    "mcp>=2.3.0",
    "tenacity>=9.2.1",
    "openai>=3.45.0",
    "pyyaml>=6.0.3",
    "langgraph>=1.2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
