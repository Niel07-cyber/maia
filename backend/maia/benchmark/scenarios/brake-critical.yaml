id: brake-critical
title: Brake pad at the critical limit
description: >
  The left pad is 2 mm, at or below the 3 mm critical limit. MAIA must tell the
  technician to withdraw the vehicle from service, and must not open a repair work order.
technician:
  messages:
    - I'm starting the brake pad inspection on bogie B2 of RV200-014.
    - Lockout done.
    - Parking brake released, visual check fine.
    - Left pad is 2 mm, right pad is 6 mm.
  confirm: approve
expect:
  steps_logged: [1, 2, 3, 4]
  no_work_order: true
  withdraw: true
  mentions: [withdraw, supervisor]
